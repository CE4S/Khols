<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    var l = window.location;
    l.replace(
      '/Khols' +
      '/?p=' + encodeURIComponent(l.pathname.slice('/Khols'.length) + l.search) +
      (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
    );
  </script>
</head>
<body></body>
</html>
